[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ratchet-size"
version = "0.1.0"
description = "A code-size budget that only goes down: keeps coding agents from bloating your repo."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Krishan Subudhi"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/krishansubudhi/ratchet"
Repository = "https://github.com/krishansubudhi/ratchet"
Issues = "https://github.com/krishansubudhi/ratchet/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ratchet = "ratchet.cli:main"

[tool.setuptools]
packages = ["ratchet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
