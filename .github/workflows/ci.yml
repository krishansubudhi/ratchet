name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ratchet check --base needs the base commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - run: python3 -m pytest -q
      - uses: ./                 # dogfood: refuse this PR if it grows past the budget
